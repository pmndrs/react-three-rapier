name: Runs Vitest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js 24.x
        uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: Enable corepack  
        run: npm install --global corepack && corepack enable
      
      - name: Install deps
        run: yarn --immutable

      # See if the build runs
      - name: Run build
        run: yarn build
    
      - name: Run tests
        run: npm run test
